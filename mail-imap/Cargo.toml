[package]
name = "mail-imap"
version = "0.1.0"
edition = "2021"

[dependencies]
imap = "2.4"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tokio-native-tls = "0.3"
native-tls = "0.2"