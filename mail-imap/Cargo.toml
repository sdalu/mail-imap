[package]
name = "mail-imap"
version = "0.1.0"
edition = "2021"

[dependencies]
# LOCAL DEV: forks with RFC 5256 THREAD support (upstream imap-proto
# release pending; see forks/ in the workspace root).
imap = { path = "../forks/rust-imap", features = ["native-tls"] }
imap-proto = { path = "../forks/tokio-imap/imap-proto" }
base64 = "0.13"
native-tls = "0.2"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
unicode-normalization = "0.1.25"
libucl = "0.2.3"
