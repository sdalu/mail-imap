[package]
name = "mail-imap"
version = "0.1.0"
edition = "2021"

# The mock backend is a development aid, not part of the product: it is
# how the suite and `scripts/check-examples.sh` run with no server, and
# how QUICKSTART demonstrates the tool without an account. The released
# binary talks to real servers, so it is built without it -- see the
# RELEASE knob in the Makefile.
[features]
default = ["mock"]
mock = []

[dependencies]
# LOCAL DEV: forks with RFC 5256 THREAD support (upstream imap-proto
# release pending; see forks/ in the workspace root).
imap = { path = "../forks/rust-imap", features = ["native-tls"] }
imap-proto = { path = "../forks/tokio-imap/imap-proto" }
base64 = "0.13"
# Direct, though it also arrives under `imap`: `append --date` has to
# hand `AppendCmd::internal_date` a `DateTime<FixedOffset>`, and Rust's
# extern prelude only exposes direct dependencies. The version tracks
# the fork's own constraint; `Cargo.lock` already resolves it, so this
# adds a name, not a build.
chrono = "0.4"
# `part strip` records a SHA-256 of what it removed, so a stripped
# attachment kept elsewhere can be matched back to the message it came
# from. It is the only operation here that destroys something, and the
# digest is what makes that auditable after the fact.
sha2 = "0.10"
native-tls = "0.2"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
unicode-normalization = "0.1.25"
libucl = "0.2.3"
