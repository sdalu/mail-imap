[package]
name = "mail-imap"
version = "0.1.0"
edition = "2021"

[dependencies]
imap = { version = "3.0.0-alpha.15", features = ["native-tls"] }
imap-proto = "0.16"
base64 = "0.13"
native-tls = "0.2"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
