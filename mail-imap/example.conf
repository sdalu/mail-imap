# mail-imap configuration -- UCL (Universal Configuration Language).
#
# Every field is shown here at its default, except the three that have
# none: server, username and password. Delete what you do not need --
# a four-line file is a perfectly good config.
#
# UCL is a superset of JSON, so a config written as a JSON object is
# still read; see example-config.json for that form.

server   = "imap.example.com"
port     = 993
username = "user@example.com"
password = "secret"

# Transport. ssl is implicit TLS (port 993); starttls upgrades a plain
# connection (port 143) and is used only when ssl is false. insecure
# accepts an invalid certificate -- for a self-signed local server.
ssl      = true
starttls = false
insecure = false

# The folder a command uses when -f names none. count ignores this and
# defaults to every mailbox.
folder = "INBOX"

# Cap on search results; 0 means unlimited. -M overrides it per run.
max = 50

# Default sort for search/unread, same spelling as -S. Unset means
# most recent first.
# sort = "-date"

# The hierarchy delimiter info reports, when the server's own answer
# is absent or wrong. Advisory only: nothing rewrites a folder name.
# delimiter = "/"

# How much this tool may change: readonly, organize, restructure, full.
# The command line may narrow this, never widen it.
access-level = organize

# Several accounts go in one file, each in a named block. Settings
# above are shared; a block overrides what it names, and -p picks one.
# With no blocks -- as above -- the file describes a single account.
#
# default = "work"
#
# work {
#     server   = "imap.work.example"
#     username = "me@work.example"
#     password = "secret"
#     access-level = organize
# }
#
# personal {
#     server   = "imap.home.example"
#     username = "me"
#     password = "secret"
# }
