# mail-imap configuration -- UCL (Universal Configuration Language).
#
# Every field is shown here at its default, except the three that have
# none: server, username and password. Delete what you do not need --
# a four-line file is a perfectly good config.
#
# UCL is a superset of JSON, so a config written as a JSON object is
# still read.

server   = "imap.example.com"
port     = 993
username = "user@example.com"

# The password, one way or the other -- exactly one of these two.
# `password` keeps it in this file; `password-command` runs a command
# and reads it from the output, so the secret can live in pass, gpg, a
# keyring or a vault without this tool knowing about any of them. The
# command goes through the shell, so a pipeline is fine, and exactly
# one trailing newline is stripped from what it prints -- a password
# ending in a space keeps its space.
password = "secret"
# password-command = "pass show mail/example"

# Transport. ssl is implicit TLS (port 993); starttls upgrades a plain
# connection (port 143) and is used only when ssl is false. insecure
# accepts an invalid certificate -- for a self-signed local server.
ssl      = true
starttls = false
insecure = false

# How to authenticate: "login" (default), or "xoauth2" when the secret
# above is an OAuth 2 access token rather than a password -- which is
# what Microsoft 365 and Gmail now want. Getting the token is not this
# tool's job; point password-command at whatever fetches it.
auth     = "login"

# Seconds to wait on the server -- the connect and the TLS handshake
# included, and a write it has stopped reading; 0 disables it. See the
# README's Timeouts section for the one thing it does not cover.
timeout  = 30

# The folder a command uses when -f names none. count ignores this and
# defaults to every mailbox.
folder = "INBOX"

# Cap on search results; 0 means no cap, and is the default. -M
# overrides it per run.
max = 0

# Default sort for search/unread, same spelling as -S. Unset means
# most recent first.
# sort = "-date"

# The hierarchy delimiter info reports, when the server's own answer
# is absent or wrong. Advisory only: nothing rewrites a folder name.
# delimiter = "/"

# How much this tool may change: survey, organize, restructure, full.
# "readonly" and "read-only" are older spellings of "survey".
# The command line may narrow this, never widen it.
access-level = organize

# Answer from the in-memory mock backend instead of connecting to the
# server -- a development build only; a released binary refuses the
# command rather than reaching for the account. It is how a full-level
# command gets tried without touching mail.
# mock = false

# Several accounts go in one file, each in a named block. Settings
# above are shared; a block overrides what it names, and -p picks one.
# With no blocks -- as above -- the file describes a single account.
#
# default = "work"
#
# work {
#     server   = "imap.work.example"
#     username = "me@work.example"
#     password = "secret"
#     access-level = organize
# }
#
# personal {
#     server   = "imap.home.example"
#     username = "me"
#     password = "secret"
# }
